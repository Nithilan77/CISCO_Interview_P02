<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hostel Food Compatibility Board — Module 1</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; background: #12141a; color: #e7e9ee; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1rem; color: #9aa1af; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-size: 0.9rem; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #2e3340; }
  th { color: #9aa1af; }
</style>
</head>
<body>
  <h1>Hostel Food Compatibility Board</h1>
  <p>Module 1 — data model loaded (read-only).</p>

  <h2>Group · budget ₹<span id="budget"></span>/person</h2>
  <table id="groupTable">
    <thead><tr><th>Resident</th><th>Diet</th><th>Allergens</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Dishes</h2>
  <table id="dishTable">
    <thead><tr><th>ID</th><th>Cafe</th><th>Dish</th><th>Diet</th><th>Ingredients</th><th>₹</th></tr></thead>
    <tbody></tbody>
  </table>

  <div style="display:flex;gap:10px;align-items:center;margin:8px 0;">
    <button id="evaluateBtn">Check compatibility</button>
    <button id="resetBtn">Reset</button>
    <button id="testBtn">Run self-tests</button>
    <input id="searchBox" type="text" placeholder="Search compatible dishes…"
           style="padding:6px 8px;background:#22262f;color:#e7e9ee;border:1px solid #2e3340;border-radius:6px;margin-left:auto;" />
  </div>
  <div id="errors" style="margin-top:12px;"></div>
  <div id="results" style="margin-top:16px;"></div>
  <div id="testResults" style="margin-top:16px;"></div>

<script>
/* ---- DATA MODEL: built-in constants ---- */
const BUILTIN_BUDGET = 150;

const BUILTIN_GROUP = [
  { name: "Asha", diet: "VEGAN",          allergens: [] },
  { name: "Dev",  diet: "VEGETARIAN",     allergens: ["PEANUT"] },
  { name: "Mira", diet: "NO_RESTRICTION", allergens: ["MILK"] },
];

const BUILTIN_DISHES = [
  { id: "D01", cafe: "Hostel Cafe",  name: "Lentil Rice Bowl", diet: "VEGAN",          ingredients: ["LENTIL", "RICE", "SPINACH"], price: 110 },
  { id: "D02", cafe: "Library Cafe", name: "Tomato Pasta",     diet: "VEGAN",          ingredients: ["WHEAT", "TOMATO"],           price: 150 },
  { id: "D03", cafe: "Hostel Cafe",  name: "Paneer Wrap",      diet: "VEGETARIAN",     ingredients: ["MILK", "WHEAT"],             price: 140 },
  { id: "D04", cafe: "East Cafe",    name: "Peanut Noodles",   diet: "VEGAN",          ingredients: ["PEANUT", "WHEAT"],           price: 130 },
  { id: "D05", cafe: "Library Cafe", name: "Egg Sandwich",     diet: "NON_VEGETARIAN", ingredients: ["EGG", "WHEAT"],              price: 100 },
];

/* ---- NORMALIZE (pure): trim + uppercase every comparable string ---- */
const norm = (s) => String(s).trim().toUpperCase();

function normalizeGroup(group) {
  return group.map((r) => ({
    name: String(r.name).trim(),      // name is a label, trimmed but not uppercased
    diet: norm(r.diet),
    allergens: r.allergens.map(norm),
  }));
}

function normalizeDishes(dishes) {
  return dishes.map((d) => ({
    id: String(d.id).trim(),
    cafe: String(d.cafe).trim(),
    name: String(d.name).trim(),
    diet: norm(d.diet),
    ingredients: d.ingredients.map(norm),
    price: d.price,
  }));
}


/* ---- VALIDATION (pure): runs before compatibility. Returns error strings. ---- */
function validate(group, dishes, budget) {
  const errors = [];

  if (!(Number.isInteger(budget) && budget > 0)) {
    errors.push(`INVALID_INPUT: group / budget / must be a positive whole rupee`);
  }

  group.forEach((r, i) => {
    if (!String(r.name).trim()) {
      errors.push(`INVALID_INPUT: group / row ${i + 1} / name`);
    }
  });

  const seen = new Set();
  dishes.forEach((d, i) => {
    const row = i + 1;
    const id = String(d.id).trim();
    if (!id)                     errors.push(`INVALID_INPUT: dishes / row ${row} / id`);
    if (!String(d.cafe).trim())  errors.push(`INVALID_INPUT: dishes / row ${row} / cafe`);
    if (!String(d.name).trim())  errors.push(`INVALID_INPUT: dishes / row ${row} / name`);
    if (!(Number.isInteger(d.price) && d.price > 0)) {
      errors.push(`INVALID_INPUT: dishes / row ${row} / price`);
    }
    if (id) {
      if (seen.has(id)) errors.push(`DUPLICATE_DISH_ID: dishes / row ${row} / id — "${id}"`);
      else seen.add(id);
    }
  });

  return errors;
}


/* ---- COMPATIBILITY (pure): one dish vs the whole group ----
   Returns { id, compatible, reasons } with reasons in contract order:
   per resident (table order) diet-before-allergen; allergens in the dish's
   ingredient order; OVER_BUDGET last. ---- */
const DIET_ACCEPTS = {
  VEGAN:          ["VEGAN"],
  VEGETARIAN:     ["VEGAN", "VEGETARIAN"],
  NO_RESTRICTION: ["VEGAN", "VEGETARIAN", "NON_VEGETARIAN"],
};

function evaluateDish(dish, group, budget) {
  const reasons = [];
  for (const resident of group) {                    // outer: each resident, table order
    const accepted = DIET_ACCEPTS[resident.diet] || [];
    if (!accepted.includes(dish.diet)) {             // diet check first
      reasons.push(`DIET:${resident.name}`);
    }
    for (const ing of dish.ingredients) {            // inner: dish ingredients (for order)
      if (resident.allergens.includes(ing)) {
        reasons.push(`ALLERGEN:${resident.name}:${ing}`);
      }
    }
  }
  if (dish.price > budget) {                          // budget once, dish-level, last
    reasons.push("OVER_BUDGET");
  }
  return { id: dish.id, compatible: reasons.length === 0, reasons };
}

function evaluateAll(group, dishes, budget) {
  return dishes.map((d) => evaluateDish(d, group, budget)); // source order preserved
}


/* ---- SEARCH (pure): filters DISPLAY only, never the count ---- */
function searchFilter(compatibleResults, query, dishById) {
  const q = query.trim().toLowerCase();
  if (!q) return compatibleResults;
  return compatibleResults.filter((res) => {
    const d = dishById[res.id];
    const haystack = [d.cafe, d.name, ...d.ingredients].join(" ").toLowerCase();
    return haystack.includes(q);
  });
}

/* ---- RENDER (read-only tables) ---- */
const group = normalizeGroup(BUILTIN_GROUP);
const dishes = normalizeDishes(BUILTIN_DISHES);

document.getElementById("budget").textContent = BUILTIN_BUDGET;

document.querySelector("#groupTable tbody").innerHTML = group.map((r) =>
  `<tr><td>${r.name}</td><td>${r.diet}</td><td>${r.allergens.join(", ") || "none"}</td></tr>`
).join("");

document.querySelector("#dishTable tbody").innerHTML = dishes.map((d) =>
  `<tr><td>${d.id}</td><td>${d.cafe}</td><td>${d.name}</td><td>${d.diet}</td><td>${d.ingredients.join(", ")}</td><td>${d.price}</td></tr>`
).join("");

/* ---- RESULTS RENDER (DOM) ---- */
const dishById = {};
dishes.forEach((d) => { dishById[d.id] = d; });

let lastResults = null;  // null until evaluated

function renderResults() {
  const area = document.getElementById("results");
  if (lastResults === null) { area.innerHTML = ""; return; }

  const compatible = lastResults.filter((r) => r.compatible);
  const excluded   = lastResults.filter((r) => !r.compatible);

  // COUNT first, from the unfiltered compatible list.
  const count = compatible.length;

  // THEN filter the display.
  const query = document.getElementById("searchBox").value;
  const shown = searchFilter(compatible, query, dishById);

  const compHtml = shown.map((r) => {
    const d = dishById[r.id];
    return `<div style="border-left:3px solid #4ea86b;padding:6px 10px;margin:4px 0;background:#1b1e27;">
      <b>${d.id} · ${d.name}</b> <span style="color:#9aa1af;">${d.cafe} · ₹${d.price}</span></div>`;
  }).join("") || `<div style="color:#9aa1af;">No compatible dish matches the search.</div>`;

  const exclHtml = excluded.map((r) => {
    const d = dishById[r.id];
    return `<div style="border-left:3px solid #d9705f;padding:6px 10px;margin:4px 0;background:#1b1e27;">
      <b>${d.id} · ${d.name}</b>
      <span style="font-family:monospace;font-size:0.8rem;color:#d9705f;"> ${r.reasons.join("  ")}</span></div>`;
  }).join("");

  area.innerHTML =
    `<p><b>${count}</b> compatible dish${count === 1 ? "" : "es"}</p>` +
    `<div style="color:#9aa1af;font-size:0.85rem;margin-top:8px;">Compatible</div>${compHtml}` +
    `<div style="color:#9aa1af;font-size:0.85rem;margin-top:8px;">Excluded</div>${exclHtml}`;
}

document.getElementById("evaluateBtn").addEventListener("click", () => {
  const errors = validate(group, dishes, BUILTIN_BUDGET);
  const errArea = document.getElementById("errors");
  if (errors.length) {
    lastResults = null;
    errArea.innerHTML = errors.map(e => `<div style="color:#d9705f;font-family:monospace;font-size:0.85rem;">${e}</div>`).join("");
  } else {
    errArea.innerHTML = "";
    lastResults = evaluateAll(group, dishes, BUILTIN_BUDGET);
  }
  renderResults();
});

document.getElementById("searchBox").addEventListener("input", renderResults);


/* ---- RESET ---- */
document.getElementById("resetBtn").addEventListener("click", () => {
  lastResults = null;
  document.getElementById("searchBox").value = "";
  document.getElementById("errors").innerHTML = "";
  document.getElementById("results").innerHTML = "";
  document.getElementById("testResults").innerHTML = "";
});

/* ---- SELF-TESTS: run against a FRESH copy of built-in data (deterministic) ---- */
function runSelfTests() {
  const g = normalizeGroup(BUILTIN_GROUP);
  const d = normalizeDishes(BUILTIN_DISHES);
  const dbi = {}; d.forEach(x => dbi[x.id] = x);
  const out = [];
  const eq = (a,b) => JSON.stringify(a) === JSON.stringify(b);
  const t = (label, got, want) => out.push({ label, ok: eq(got, want) });

  const res = evaluateAll(g, d, 150);
  const P = (id) => res.find(r => r.id === id);
  const compatible = res.filter(r => r.compatible);

  t("oracle: compatible [D01,D02]", compatible.map(r=>r.id), ["D01","D02"]);
  t("oracle: count 2", compatible.length, 2);
  t("D03 reasons", P("D03").reasons, ["DIET:Asha","ALLERGEN:Mira:MILK"]);
  t("D04 reasons", P("D04").reasons, ["ALLERGEN:Dev:PEANUT"]);
  t("D05 reasons", P("D05").reasons, ["DIET:Asha","DIET:Dev"]);
  t("budget boundary: D02 at 150 compatible", P("D02").compatible, true);
  const r130 = evaluateAll(g, d, 130);
  t("budget 130: D02 OVER_BUDGET", r130.find(r=>r.id==="D02").reasons, ["OVER_BUDGET"]);
  t("search wheat -> [D02]", searchFilter(compatible,"wheat",dbi).map(r=>r.id), ["D02"]);
  t("search keeps count 2", compatible.length, 2);
  t("validation: zero price rejected", validate(g,[{...d[0],price:0}],150).length>0, true);
  t("validation: duplicate id", validate(g,[d[0],{...d[1],id:"D01"}],150).some(e=>e.startsWith("DUPLICATE_DISH_ID")), true);
  t("diet: VEGAN rejects VEGETARIAN dish", evaluateDish({id:"T",cafe:"c",name:"n",diet:"VEGETARIAN",ingredients:[],price:10},[{name:"X",diet:"VEGAN",allergens:[]}],150).reasons, ["DIET:X"]);
  t("diet: NO_RESTRICTION accepts NON_VEGETARIAN", evaluateDish({id:"T",cafe:"c",name:"n",diet:"NON_VEGETARIAN",ingredients:[],price:10},[{name:"X",diet:"NO_RESTRICTION",allergens:[]}],150).compatible, true);
  t("edge: empty group -> compatible", evaluateDish(d[4],[],150).compatible, true);

  return out;
}

document.getElementById("testBtn").addEventListener("click", () => {
  const results = runSelfTests();
  const passed = results.filter(r=>r.ok).length;
  const area = document.getElementById("testResults");
  area.innerHTML =
    `<p style="color:${passed===results.length?'#4ea86b':'#d9705f'}"><b>Self-tests: ${passed}/${results.length} passed</b></p>` +
    results.map(r => `<div style="font-family:monospace;font-size:0.8rem;color:${r.ok?'#4ea86b':'#d9705f'}">${r.ok?'PASS':'FAIL'}  ${r.label}</div>`).join("");
});

  window.__evaluateAll = evaluateAll; window.__evaluateDish = evaluateDish;
  window.__group = group; window.__dishes = dishes;
  window.__searchFilter = searchFilter; window.__dishById = dishById;
  window.__runSelfTests = runSelfTests;
</script>
</body>
</html>
